<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agro Colombia Company</title>
  <meta name="description" content="Agro Colombia Company — Sitio en construcción." />
  <meta name="theme-color" content="#0a1a0f" />
  <link rel="icon" type="image/jpeg" href="img/logo.jpeg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />

  <script>
    // Aplica tema e idioma antes de pintar para evitar parpadeo
    (function () {
      var theme, lang;
      try { theme = localStorage.getItem('acc-theme'); lang = localStorage.getItem('acc-lang'); } catch (e) {}
      if (!theme) theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      if (!lang) lang = (navigator.language || 'es').toLowerCase().indexOf('es') === 0 ? 'es' : 'en';
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.setAttribute('lang', lang);
    })();
  </script>

  <style>
    :root {
      --gold-1: #f6dc8c;
      --gold-2: #d9a93a;
      --gold-3: #a8781c;
      --forest: #0a1a0f;
      --ease: cubic-bezier(.2, .7, .2, 1);
    }

    [data-theme="dark"] {
      --bg: #08150c;
      --bg-glow: rgba(217, 169, 58, .10);
      --surface: rgba(255, 255, 255, .04);
      --border: rgba(246, 220, 140, .16);
      --text: #efe8d2;
      --muted: rgba(239, 232, 210, .62);
      --accent: var(--gold-2);
      --track: rgba(246, 220, 140, .12);
      --leaf: rgba(217, 169, 58, .5);
      --title-grad: linear-gradient(100deg, var(--gold-3) 0%, var(--gold-2) 30%, var(--gold-1) 50%, var(--gold-2) 70%, var(--gold-3) 100%);
    }

    [data-theme="light"] {
      --bg: #f6f2e7;
      --bg-glow: rgba(217, 169, 58, .18);
      --surface: rgba(10, 26, 15, .04);
      --border: rgba(10, 26, 15, .12);
      --text: #13291a;
      --muted: rgba(19, 41, 26, .62);
      --accent: #a8781c;
      --track: rgba(10, 26, 15, .08);
      --leaf: rgba(168, 120, 28, .45);
      --title-grad: linear-gradient(100deg, #7a5410 0%, #a8781c 30%, #d9a93a 50%, #a8781c 70%, #7a5410 100%);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      transition: background-color .6s var(--ease), color .6s var(--ease);
      -webkit-font-smoothing: antialiased;
    }

    /* Fondo: halo dorado suave + grano */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(60vmax 60vmax at 50% 42%, var(--bg-glow), transparent 60%),
        radial-gradient(40vmax 40vmax at 100% 100%, var(--bg-glow), transparent 70%);
      pointer-events: none;
      z-index: 0;
      transition: opacity .6s;
    }

    /* Hojas flotantes */
    .leaves { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .leaf {
      position: absolute;
      top: -40px;
      width: 12px; height: 12px;
      background: var(--leaf);
      border-radius: 0 100% 0 100%;
      opacity: 0;
      animation: fall linear infinite;
    }
    @keyframes fall {
      0%   { transform: translate3d(0, 0, 0) rotate(0deg); opacity: 0; }
      10%  { opacity: .9; }
      90%  { opacity: .6; }
      100% { transform: translate3d(var(--drift, 60px), 110vh, 0) rotate(540deg); opacity: 0; }
    }

    /* Header */
    header {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px clamp(16px, 4vw, 48px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text);
    }
    .brand .mini { width: 36px; height: 36px; }
    .brand span {
      font-family: 'Cinzel', serif;
      font-size: 13px;
      letter-spacing: .22em;
      font-weight: 600;
    }

    .controls { display: flex; align-items: center; gap: 10px; }

    .lang {
      display: inline-flex;
      padding: 3px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      backdrop-filter: blur(8px);
    }
    .lang button {
      border: 0;
      background: transparent;
      color: var(--muted);
      font: 500 12px/1 'Inter', sans-serif;
      letter-spacing: .08em;
      padding: 8px 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: color .3s, background .3s;
    }
    .lang button[aria-pressed="true"] {
      background: linear-gradient(135deg, var(--gold-1), var(--gold-2));
      color: var(--forest);
    }

    .theme-btn {
      width: 38px; height: 38px;
      display: grid; place-items: center;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--surface);
      backdrop-filter: blur(8px);
      color: var(--accent);
      cursor: pointer;
      transition: transform .4s var(--ease), border-color .3s;
    }
    .theme-btn:hover { transform: rotate(18deg); border-color: var(--accent); }
    .theme-btn svg { width: 18px; height: 18px; }
    [data-theme="dark"] .icon-sun, [data-theme="light"] .icon-moon { display: none; }

    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* Medallón del logo (recorta el emblema circular de la imagen) */
    .medallion {
      position: relative;
      border-radius: 50%;
      overflow: hidden;
      background: var(--forest);
      flex-shrink: 0;
    }
    .medallion img {
      position: absolute;
      width: 285%;
      left: -92%;
      top: -78.4%;
      max-width: none;
      user-select: none;
      pointer-events: none;
    }

    /* Contenido principal */
    main {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px 16px 40px;
    }

    .emblem {
      position: relative;
      width: clamp(180px, 42vw, 240px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      margin-bottom: 40px;
      animation: rise 1.2s var(--ease) both;
    }
    .emblem .medallion {
      width: 78%;
      height: 78%;
      box-shadow: 0 20px 60px -20px rgba(217, 169, 58, .45), inset 0 0 0 1px rgba(246, 220, 140, .25);
      animation: breathe 5s ease-in-out infinite;
    }

    /* Anillos giratorios */
    .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1.5px));
              mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1.5px));
    }
    .ring.track { background: var(--track); }
    .ring.spin {
      background: conic-gradient(from 0deg, transparent 0 55%, var(--gold-3) 75%, var(--gold-1) 100%);
      animation: spin 2.8s linear infinite;
    }
    .ring.spin::after {
      content: '';
      position: absolute;
      top: 0; left: 50%;
      width: 6px; height: 6px;
      margin-left: -3px;
      border-radius: 50%;
      background: var(--gold-1);
      box-shadow: 0 0 12px 2px var(--gold-2);
    }
    .ring.outer {
      inset: -14px;
      background: none;
      -webkit-mask: none; mask: none;
      border: 1px dashed var(--border);
      animation: spin 40s linear infinite reverse;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(16px) scale(.96); }
      to { opacity: 1; transform: none; }
    }

    .title {
      font-family: 'Cinzel', serif;
      font-weight: 600;
      font-size: clamp(28px, 6.5vw, 52px);
      letter-spacing: .06em;
      line-height: 1.1;
      background: var(--title-grad);
      background-size: 200% auto;
      -webkit-background-clip: text;
              background-clip: text;
      color: transparent;
      animation: rise 1.2s .15s var(--ease) both, sheen 6s linear infinite;
    }
    @keyframes sheen { to { background-position: -200% center; } }

    .subtitle {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 10px;
      font-family: 'Cinzel', serif;
      font-size: clamp(12px, 2.4vw, 15px);
      letter-spacing: .5em;
      color: var(--accent);
      animation: rise 1.2s .25s var(--ease) both;
    }
    .subtitle::before, .subtitle::after {
      content: '';
      width: clamp(24px, 8vw, 64px);
      height: 1px;
      background: currentColor;
      opacity: .7;
    }
    .subtitle span { margin-right: -.5em; }

    .status {
      margin-top: 44px;
      max-width: 460px;
      animation: rise 1.2s .4s var(--ease) both;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .badge i {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--gold-2);
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(217, 169, 58, .6); }
      50% { box-shadow: 0 0 0 6px rgba(217, 169, 58, 0); }
    }

    .message {
      margin-top: 18px;
      font-size: clamp(14px, 2.2vw, 16px);
      font-weight: 300;
      line-height: 1.7;
      color: var(--muted);
    }


    footer {
      position: relative;
      z-index: 1;
      padding: 20px 16px 28px;
      text-align: center;
      font-size: 12px;
      letter-spacing: .08em;
      color: var(--muted);
    }

    /* Transición suave del texto al cambiar idioma */
    [data-i18n] { transition: opacity .25s; }
    .swapping [data-i18n] { opacity: 0; }

    @media (max-width: 480px) {
      .brand span { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
      .leaves { display: none; }
      .ring.spin { animation-duration: 2.8s !important; animation-iteration-count: infinite !important; }
    }
  </style>
</head>
<body>
  <div class="leaves" aria-hidden="true"></div>

  <header>
    <a class="brand" href="index.html" aria-label="Agro Colombia Company">
      <div class="medallion mini"><img src="img/logo.jpeg" alt="" /></div>
      <span>AGRO COLOMBIA</span>
    </a>

    <div class="controls">
      <div class="lang" role="group" aria-label="Idioma / Language">
        <button type="button" data-lang="es" aria-pressed="true">ES</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <button type="button" class="theme-btn" id="themeToggle" aria-label="Cambiar tema">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main>
    <div class="emblem" aria-hidden="true">
      <div class="ring outer"></div>
      <div class="ring track"></div>
      <div class="ring spin"></div>
      <div class="medallion"><img src="img/logo.jpeg" alt="" /></div>
    </div>

    <h1 class="title">AGRO COLOMBIA</h1>
    <p class="subtitle"><span>COMPANY</span></p>

    <section class="status" aria-live="polite">
      <div class="badge"><i></i><span data-i18n="badge">En construcción</span></div>
      <p class="message" data-i18n="message">Estamos cultivando algo especial. Muy pronto conocerás nuestra nueva experiencia digital.</p>
    </section>
  </main>

  <footer>
    <span>&copy; <span id="year"></span> Agro Colombia Company</span> ·
    <span data-i18n="footer">Raíces que crecen</span>
  </footer>

  <script>
    (function () {
      var root = document.documentElement;
      var dict = {
        es: {
          badge: 'En construcción',
          message: 'Estamos cultivando algo especial. Muy pronto conocerás nuestra nueva experiencia digital.',
          footer: 'Raíces que crecen',
          themeLabel: 'Cambiar tema',
          title: 'Agro Colombia Company — Sitio en construcción'
        },
        en: {
          badge: 'Under construction',
          message: 'We are growing something special. Our new digital experience is coming very soon.',
          footer: 'Roots that grow',
          themeLabel: 'Toggle theme',
          title: 'Agro Colombia Company — Under construction'
        }
      };

      function save(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }

      function applyLang(lang, animate) {
        var t = dict[lang];
        var render = function () {
          root.setAttribute('lang', lang);
          document.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = t[el.dataset.i18n]; });
          document.querySelectorAll('[data-lang]').forEach(function (b) {
            b.setAttribute('aria-pressed', b.dataset.lang === lang ? 'true' : 'false');
          });
          document.getElementById('themeToggle').setAttribute('aria-label', t.themeLabel);
          document.title = t.title;
          document.body.classList.remove('swapping');
        };
        if (animate) { document.body.classList.add('swapping'); setTimeout(render, 220); }
        else render();
      }

      document.querySelectorAll('[data-lang]').forEach(function (b) {
        b.addEventListener('click', function () {
          if (b.dataset.lang === root.getAttribute('lang')) return;
          save('acc-lang', b.dataset.lang);
          applyLang(b.dataset.lang, true);
        });
      });

      document.getElementById('themeToggle').addEventListener('click', function () {
        var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        document.querySelector('meta[name="theme-color"]').setAttribute('content', next === 'dark' ? '#08150c' : '#f6f2e7');
        save('acc-theme', next);
      });

      applyLang(root.getAttribute('lang') === 'en' ? 'en' : 'es', false);
      document.getElementById('year').textContent = new Date().getFullYear();

      // Hojas doradas sutiles
      var leaves = document.querySelector('.leaves');
      var count = window.innerWidth < 600 ? 7 : 14;
      for (var i = 0; i < count; i++) {
        var l = document.createElement('span');
        var size = 6 + Math.random() * 9;
        l.className = 'leaf';
        l.style.left = (Math.random() * 100) + '%';
        l.style.width = l.style.height = size + 'px';
        l.style.animationDuration = (14 + Math.random() * 14) + 's';
        l.style.animationDelay = (-Math.random() * 28) + 's';
        l.style.setProperty('--drift', ((Math.random() - .5) * 200) + 'px');
        leaves.appendChild(l);
      }
    })();
  </script>
</body>
</html>
